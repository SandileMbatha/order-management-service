spring:
  application:
    name: order-management-service

  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Caching
  cache:
    type: simple

server:
  port: 8080

# Security
api:
  security:
    key: my-secret-api-key-2026

